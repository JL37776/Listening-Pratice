<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7faf9" />
    <title>Listening Practice</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <button class="icon-button" id="openLibrary" aria-label="Open project library">Files</button>
        <div>
          <p class="eyebrow" id="engineStatus">Kokoro TTS</p>
          <h1>Listening Practice</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="fullscreenButton" aria-label="Toggle fullscreen">Full</button>
          <button class="icon-button" id="settingsButton" aria-label="Open settings">Settings</button>
          <button class="icon-button primary" id="quickAdd" aria-label="Add sentence">Add</button>
        </div>
      </header>

      <button class="project-pill" id="projectPicker">
        <span id="currentFolderName">Daily English</span>
        <span>/</span>
        <strong id="currentProjectName">Morning Practice</strong>
      </button>

      <section class="player-panel" aria-label="Playback controls">
        <div class="now-playing">
          <button class="play-button" id="playPause" aria-label="Play or stop">
            <span id="playIcon">Play</span>
          </button>
          <div class="now-copy">
            <p id="nowTitle">Ready</p>
            <small id="nowSubtitle">Select a sentence, then press play.</small>
          </div>
        </div>

        <div class="transport-row">
          <button class="small-control" id="prevSentence" aria-label="Previous sentence">Prev</button>
          <button class="small-control" id="nextSentence" aria-label="Next sentence">Next</button>
        </div>

        <div class="basic-controls">
          <label>
            <span>Repeat Strategy</span>
            <select id="repeatScope">
              <option value="sentence">Single sentence</option>
              <option value="project">Whole project</option>
              <option value="project-speed-pattern">Project speed pattern</option>
            </select>
          </label>
          <label>
            <span>Repeat Count</span>
            <input id="repeatCount" type="number" min="1" max="9" value="3" />
          </label>
          <label>
            <span>Speed</span>
            <input id="rateRange" type="range" min="0.5" max="1.5" step="0.1" value="0.9" />
            <b id="rateLabel">0.9x</b>
          </label>
          <label id="speedPatternRow">
            <span>Speed Pattern</span>
            <input id="speedPattern" inputmode="decimal" placeholder="1, 0.8, 0.5" />
          </label>
        </div>
      </section>

      <section class="practice-card">
        <div class="section-heading">
          <h2>Sentences</h2>
          <button class="text-button" id="addSentence">New Sentence</button>
        </div>
        <div class="sentence-list" id="sentenceList"></div>
      </section>

      <form class="composer" id="sentenceForm">
        <input id="sentenceInput" autocomplete="off" placeholder="Type a new sentence..." />
        <button type="submit" class="send-button">Save</button>
      </form>
    </main>

    <dialog class="sheet" id="settingsDialog">
      <form method="dialog" class="sheet-inner">
        <div class="sheet-head">
          <h2>Voice Settings</h2>
          <button class="icon-button" value="cancel" aria-label="Close">X</button>
        </div>
        <div class="settings-grid">
          <label>
            <span>Engine</span>
            <select id="engineSelect">
              <option value="kokoro">Kokoro Local</option>
              <option value="system">System Voice</option>
            </select>
          </label>
          <label>
            <span>Kokoro Voice</span>
            <select id="kokoroVoiceSelect">
              <option value="af_heart">Heart - US female</option>
              <option value="af_bella">Bella - US female</option>
              <option value="af_nicole">Nicole - US female</option>
              <option value="af_sky">Sky - US female</option>
              <option value="am_adam">Adam - US male</option>
              <option value="am_michael">Michael - US male</option>
              <option value="bf_emma">Emma - UK female</option>
              <option value="bm_george">George - UK male</option>
            </select>
          </label>
          <label>
            <span>Device</span>
            <select id="kokoroDeviceSelect">
              <option value="auto">Auto</option>
              <option value="webgpu">WebGPU</option>
              <option value="wasm">WASM</option>
            </select>
          </label>
          <label>
            <span>Quality</span>
            <select id="kokoroDtypeSelect">
              <option value="auto">Auto</option>
              <option value="fp32">Best</option>
              <option value="q8">Balanced</option>
              <option value="q4">Small</option>
            </select>
          </label>
        </div>

        <label class="voice-row" id="systemVoiceRow">
          <span>System Voice</span>
          <select id="systemVoiceSelect">
            <option value="">System Default</option>
          </select>
        </label>
        <div class="dialog-actions">
          <button type="button" class="text-button install-trigger">Install Model</button>
          <button type="submit" class="send-button">Done</button>
        </div>
      </form>
    </dialog>

    <dialog class="sheet install-sheet" id="installDialog">
      <form method="dialog" class="sheet-inner">
        <div class="sheet-head">
          <h2>Install Kokoro</h2>
        </div>
        <p class="install-copy">The voice model downloads once and then runs locally in your browser.</p>
        <div class="install-progress">
          <span id="installProgressFill"></span>
        </div>
        <div class="install-meta">
          <span id="installStatus">Preparing model...</span>
          <strong id="installProgressText">0%</strong>
        </div>
        <div class="dialog-actions">
          <button type="button" id="skipInstall">Later</button>
          <button type="button" class="send-button install-trigger">Install</button>
        </div>
      </form>
    </dialog>

    <dialog class="sheet" id="libraryDialog">
      <form method="dialog" class="sheet-inner">
        <div class="sheet-head">
          <h2>Project Library</h2>
          <button class="icon-button" value="cancel" aria-label="Close">X</button>
        </div>
        <div class="library-actions">
          <button type="button" id="createFolder">New Folder</button>
          <button type="button" id="createProject">New Project</button>
        </div>
        <div id="folderList" class="folder-list"></div>
      </form>
    </dialog>

    <dialog class="sheet" id="editDialog">
      <form method="dialog" class="sheet-inner" id="editForm">
        <div class="sheet-head">
          <h2>Edit Sentence</h2>
          <button class="icon-button" value="cancel" aria-label="Close">X</button>
        </div>
        <label class="stacked-field">
          <span>Sentence</span>
          <textarea id="editText" rows="4" required></textarea>
        </label>
        <label class="stacked-field">
          <span>Note</span>
          <textarea id="editNote" rows="3"></textarea>
        </label>
        <div class="dialog-actions">
          <button type="button" class="danger" id="deleteSentence">Delete</button>
          <button type="submit" class="send-button">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="app.js?v=20260605-tts-debug-2"></script>
  </body>
</html>
